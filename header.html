<style>
  /* Стили для шапки */
  .topbar{background:#071c38;color:rgba(255,255,255,.72);font-size:13.5px}
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:46px;width:min(1300px,100% - 40px);margin-inline:auto}
  .topbar-group{display:flex;gap:26px;flex-wrap:wrap}
  .topbar a:hover{color:#fff; text-decoration:none}
  
  .header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid #dbe3ec}
  .header-inner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:28px;min-height:86px;width:min(1300px,100% - 40px);margin-inline:auto}
  .logo{display:flex;align-items:center;gap:14px;font-size:23px;font-weight:800;letter-spacing:-.03em;min-width:0;text-decoration:none;color:#0f172a}
  .logo-mark{width:60px;height:60px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-size:20px;overflow:hidden}
  .logo-mark img{width:100%;height:100%;object-fit:contain}
  .logo small{display:block;font-size:11px;font-weight:700;color:#5b6b7f;letter-spacing:.06em;text-transform:uppercase}
  
  .nav{display:flex;justify-content:center;gap:4px;min-width:0}
  .nav a{padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px;color:#42526b;transition:.2s;white-space:nowrap;text-decoration:none}
  .nav a:hover{color:#0a3d7c;background:#f0f5fd}
  .nav a.active{color:#0a3d7c;background:#e3edfb}
  
  .header-actions{display:flex;align-items:center;gap:14px;min-width:0}
  .contact-mini{text-align:right;min-width:0;white-space:nowrap;text-decoration:none;color:inherit}
  .contact-mini b{display:block;font-size:16px;line-height:1.2}
  .burger{display:none;width:50px;height:50px;flex:0 0 auto;border:1px solid #dbe3ec;border-radius:14px;background:#fff;font-size:20px}
  
  @media(max-width:760px){
    .topbar-group{display:none}
    .nav{display:none}
    .header-actions .contact-mini{display:none}
    .header-inner{grid-template-columns:minmax(0,1fr) auto;gap:12px;min-height:72px}
    .logo{gap:10px;font-size:19px}
    .logo-mark{width:44px;height:44px}
    .logo small{font-size:9.5px}
    .burger{display:grid;place-items:center}
  }
</style>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-group">
      <a href="/#categories">О категориях</a>
      <a href="/#brands">О брендах</a>
      <a href="/#about">О компании</a>
      <a href="/#services">Услуги</a>
    </div>
    <div class="topbar-group">
      <a href="mailto:info@scorpmash.ru">info@scorpmash.ru</a>
      <a href="tel:+79826594620">+7 (982) 659-46-20</a>
    </div>
  </div>
</div>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="/">
      <span class="logo-mark">
        <img src="https://eimage.sendsay.ru/image/x_1788758751895056/logo%5Fblue%5F1.png" alt="Scorpmash">
      </span>
      <span>
        Scorpmash
        <small>Инженерное оборудование</small>
      </span>
    </a>
    <nav class="nav">
      <a href="/#categories" data-nav="categories">Категории</a>
      <a href="/#brands" data-nav="brands">Бренды</a>
      <a href="/#contacts" data-nav="contacts">Контакты</a>
    </nav>
    <div class="header-actions">
      <a class="contact-mini" href="tel:+79826594620"><b>+7 (982) 659-46-20</b></a>
      <a class="contact-mini" href="mailto:sale@scorpmash.ru"><b>sale@scorpmash.ru</b></a>
      <button class="burger" aria-label="Открыть меню">☰</button>
    </div>
  </div>
</header>

<script>
  // Этот скрипт запускается только когда шапка уже вставилась на страницу
  (function() {
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav a').forEach(link => {
      // Если мы в папке brand или category, подсвечиваем нужную кнопку
      if (currentPath.includes('/brand/') && link.dataset.nav === 'brands') link.classList.add('active');
      if (currentPath.includes('/category/') && link.dataset.nav === 'categories') link.classList.add('active');
    });
  })();
</script>
